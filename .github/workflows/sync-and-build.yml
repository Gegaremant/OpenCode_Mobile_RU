name: Sync & Build with Russian Locale

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this exact upstream commit was already built
        type: boolean
        default: false

# ─── Where the app source comes from ──────────────────────────────────────────
#
# This block is the switch.
#
# opencode-mobile's v2 client (routes under /api/, {data,cursor} envelopes, its
# own SSE format) lives in upstream PR #209 and is still unmerged, so the patch
# that adds it is vendored here as src/upstream-v2/v2-client.patch and applied
# on top of the clone. See src/upstream-v2/README.md for why it is vendored
# rather than tracked on a fork.
#
# When #209 lands upstream: set UPSTREAM_V2_OVERLAY to "" and nothing else here
# changes — the apply step skips itself.
#
# UPSTREAM_REF may be a branch or a tag. The build is keyed on the resolved
# commit *plus* a hash of the overlay, so moving upstream forward, or editing
# the overlay, both trigger a rebuild.
env:
  UPSTREAM_REPO: dzianisv/opencode-mobile
  UPSTREAM_REF: main
  UPSTREAM_V2_OVERLAY: src/upstream-v2/v2-client.patch
  # Android refuses to install over an equal or lower versionCode, so this has
  # to grow with every shipped APK. Bump by hand; it is the only manual step.
  RU_VERSION_CODE: "44"
  SELF_REPO: Gegaremant/OpenCode_Mobile_RU

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_TOKEN }}

      - name: Resolve upstream source
        id: source
        run: |
          set -euo pipefail
          # `git ls-remote` exits 128 on a missing/unreachable repo, and with
          # `set -e` that kills the step before the message below can print —
          # which is exactly what happened while the build pointed at a fork
          # that had stopped answering. Check the exit status explicitly.
          if ! SHA=$(git ls-remote "https://github.com/${{ env.UPSTREAM_REPO }}.git" \
              "refs/heads/${{ env.UPSTREAM_REF }}" "refs/tags/${{ env.UPSTREAM_REF }}" 2>&1); then
            echo "ERROR: cannot reach ${{ env.UPSTREAM_REPO }} at ref '${{ env.UPSTREAM_REF }}'"
            echo "$SHA"
            exit 1
          fi
          SHA=$(printf '%s\n' "$SHA" | awk '{print $1}' | head -1)
          [ -n "$SHA" ] || { echo "ERROR: ${{ env.UPSTREAM_REF }} not found in ${{ env.UPSTREAM_REPO }}"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # Part of the build identity: editing the overlay has to rebuild even
          # when upstream stands still. "none" when there is no overlay, i.e.
          # once v2 is upstream.
          OVERLAY="${{ env.UPSTREAM_V2_OVERLAY }}"
          if [ -n "$OVERLAY" ]; then
            [ -f "$OVERLAY" ] || { echo "ERROR: overlay not found: $OVERLAY"; exit 1; }
            OVERLAY_ID=$(sha256sum "$OVERLAY" | cut -c1-12)
            OVERLAY_FLAG=".v2"
          else
            OVERLAY_ID=none
            OVERLAY_FLAG=""
          fi
          echo "overlay=$OVERLAY_ID" >> "$GITHUB_OUTPUT"
          echo "overlay_flag=$OVERLAY_FLAG" >> "$GITHUB_OUTPUT"
          echo "Source: ${{ env.UPSTREAM_REPO }}@${{ env.UPSTREAM_REF }} -> $SHA (overlay: $OVERLAY_ID)"

      - name: Check if already synced
        id: check_sync
        run: |
          set -euo pipefail
          # Keyed on the commit plus the overlay hash, so moving upstream forward
          # or editing the overlay rebuilds, and an unchanged pair does not.
          # `force` re-runs a build whose output we already have.
          KEY="${{ steps.source.outputs.sha }}-${{ steps.source.outputs.overlay }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "already_synced=false" >> "$GITHUB_OUTPUT"
            echo "force requested — rebuilding regardless of sync marker"
          elif git tag -l "synced-$KEY" | grep -q .; then
            echo "already_synced=true" >> "$GITHUB_OUTPUT"
            echo "Already built $KEY, skipping."
          else
            echo "already_synced=false" >> "$GITHUB_OUTPUT"
            echo "New build: $KEY"
          fi

      - name: Setup Node.js
        if: steps.check_sync.outputs.already_synced == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Java
        if: steps.check_sync.outputs.already_synced == 'false'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        if: steps.check_sync.outputs.already_synced == 'false'
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        if: steps.check_sync.outputs.already_synced == 'false'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Clone upstream source at the resolved commit
        if: steps.check_sync.outputs.already_synced == 'false'
        run: |
          set -euo pipefail
          rm -rf original-src
          # Clone the default branch, then check out the exact commit we keyed
          # the build on — a clone --branch of a moving ref would not be pinned
          # to what check_sync just verified.
          git clone --depth 1 "https://github.com/${{ env.UPSTREAM_REPO }}.git" original-src
          git -C original-src fetch --depth 1 origin "${{ steps.source.outputs.sha }}"
          git -C original-src checkout --detach FETCH_HEAD
          echo "checked out $(git -C original-src rev-parse HEAD)"

      - name: Apply the vendored v2 client
        if: steps.check_sync.outputs.already_synced == 'false'
        run: |
          set -euo pipefail
          OVERLAY="${{ env.UPSTREAM_V2_OVERLAY }}"
          if [ -z "$OVERLAY" ]; then
            echo "no overlay configured — building upstream as-is"
            exit 0
          fi
          git -C original-src apply --verbose "$OVERLAY"
          # Fail here, loudly, rather than 20 minutes later at the APK check:
          # every symptom downstream is "the app cannot talk to a v2 server".
          for MARKER in src/lib/api-detect.ts src/lib/v2-shape.ts src/lib/sdk-v1.ts; do
            [ -f "original-src/$MARKER" ] || {
              echo "ERROR: overlay applied but $MARKER is missing — v2 client is not in this build"
              exit 1
            }
          done
          echo "v2 client overlay applied and verified"

      - name: Apply Russian locale patch
        if: steps.check_sync.outputs.already_synced == 'false'
        run: |
          set -euo pipefail
          SRC=original-src

          # 1. Copy ru.json into i18n directory
          cp src/patches/ru.json "$SRC/src/lib/i18n/ru.json"

          # 2. Patch locale-resolve.ts: add "ru" to SUPPORTED_LOCALES and matchSupportedLocale
          RESOLVE="$SRC/src/lib/i18n/locale-resolve.ts"
          sed -i 's/export const SUPPORTED_LOCALES = \["en", "zh-Hans"\] as const/export const SUPPORTED_LOCALES = ["en", "zh-Hans", "ru"] as const/' "$RESOLVE"
          sed -i '/if (lower.startsWith("zh")) return "zh-Hans"/a\  if (lower.startsWith("ru")) return "ru"' "$RESOLVE"

          # 3. Patch config.ts: import ru and add to resources
          CONFIG="$SRC/src/lib/i18n/config.ts"
          sed -i 's|import zhHans from "./zh-Hans.json"|import zhHans from "./zh-Hans.json"\nimport ru from "./ru.json"|' "$CONFIG"
          sed -i 's|"zh-Hans": { translation: zhHans },|"zh-Hans": { translation: zhHans },\n  ru: { translation: ru },|' "$CONFIG"

          # 4. Add "ru" language label to en.json and zh-Hans.json so the picker shows it
          node -e "
            const fs = require('fs');
            for (const f of ['en.json', 'zh-Hans.json']) {
              const p = '$SRC/src/lib/i18n/' + f;
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (j.settings && j.settings.language) j.settings.language.ru = 'Russian';
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            }
          "

          # 5. Replace the Alert-based language picker in settings.tsx with a
          #    Modal that lists ALL locales. Android's Alert.alert silently
          #    truncates buttons to 3, so "ru" (the 4th) could never appear.
          node src/patches/patch-settings.js "$SRC"

          # 6. Markdown typography: bold runs overlapped the neighbouring lines
          #    and the leading was far too tight (nested <Text> spans kept
          #    react-native-marked's 16/24 defaults inside 15/22 body text).
          node src/patches/patch-markdown.js "$SRC"

          # 7. Keyboard: KeyboardAvoidingView pads nothing on Android (RN
          #    reports screenY as the already-resized frame bottom) and the
          #    edge-to-edge window is never resized, so the composer and the
          #    connection forms were buried under the keyboard.
          node src/patches/patch-keyboard.js "$SRC"

          # 8. Voice input: classify/localize the "not-allowed" error, offer the
          #    OS settings toggle, and recognise in the UI language.
          node src/patches/patch-speech.js "$SRC"

          # 9. Session archive (per chat + per project) and transcript export.
          #    Adds src/components/ActionSheet.tsx because Android's Alert.alert
          #    keeps only three buttons and these menus need five.
          node src/patches/patch-archive.js "$SRC"

          # 10. About/privacy links must point at THIS repository, not upstream.
          node src/patches/patch-links.js "$SRC"

          # 11. Autosave the composer's unsent text (debounced, per session).
          node src/patches/patch-drafts.js "$SRC"

          # 12. Dictation: pin Google's recognition service, prefer the on-device
          #     model when it is downloaded, feed the recogniser the composer text.
          node src/patches/patch-voice.js "$SRC"

          # 13. Repaint: one coherent, WCAG-legible ramp replaces the hand-picked
          #     greys and the violet accent. Must run last of the styling patches.
          node src/patches/patch-palette.js "$SRC"

          # 14. Theme preference (System/Light/Dark) on top of the new palette.
          #     Needs ActionSheet from step 9, so it comes after patch-archive.
          node src/patches/patch-theme.js "$SRC"

          # 15. Connection diagnostics: recognise a v2 server instead of
          #     reporting the web SPA's 200 on /global/health as a healthy one.
          node src/patches/patch-diagnostics.js "$SRC"

          # 16. Stamp our own version + versionCode.
          #     The version name is upstream's app.json plus "-ru", with "v2"
          #     appended exactly when the v2 overlay is in play — that is the
          #     thing a user needs to see, not which branch we cloned. versionCode
          #     is ours to raise: Android refuses to install over an equal or
          #     lower one, so shipping a rebuild of the same upstream version
          #     without bumping it would be un-installable.
          SUFFIX="ru${{ steps.source.outputs.overlay_flag }}"
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('$SRC/app.json', 'utf8'));
            app.expo.version = app.expo.version + '-${SUFFIX}';
            app.expo.android.versionCode = Number('${{ env.RU_VERSION_CODE }}');
            fs.writeFileSync('$SRC/app.json', JSON.stringify(app, null, 2) + '\n');
            console.log('version:', app.expo.version, 'versionCode:', app.expo.android.versionCode);
          "

          echo "Russian locale patch applied successfully"

      - name: Diagnostics - verify patched locale files
        if: steps.check_sync.outputs.already_synced == 'false'
        working-directory: original-src
        run: |
          echo "=== ru.json exists ==="
          ls -la src/lib/i18n/ru.json || echo "MISSING ru.json"
          echo "=== config.ts resources ==="
          grep -n '"ru"\|ru: { translation' src/lib/i18n/config.ts || echo "NO ru in config.ts"
          echo "=== locale-resolve.ts supported ==="
          grep -n 'SUPPORTED_LOCALES\|"ru"' src/lib/i18n/locale-resolve.ts || echo "NO ru in locale-resolve.ts"
          echo "=== en.json language section ==="
          node -e "const j=require('./src/lib/i18n/en.json'); console.log(JSON.stringify(j.settings.language))"
          echo "=== settings.tsx menu entries ==="
          grep -n 'chooseLocale("ru")\|localeLabels.ru\|languagePickerVisible\|localeLabels\["zh-Hans"\]' "app/(tabs)/settings.tsx" || echo "NO ru menu in settings.tsx"
          echo "=== markdown metrics ==="
          grep -n 'BASE_TEXT\|lineHeight' src/components/markdown/Markdown.tsx | head -5 || echo "!!! markdown not patched"
          echo "=== keyboard avoidance ==="
          ls src/lib/keyboard-inset.ts || echo "!!! keyboard-inset.ts MISSING"
          # On the v2 client the chat screen uses react-native-keyboard-controller
          # instead of our inset hook, so 0 there is correct; the connection
          # forms are still ours on both generations and must use it.
          grep -c 'keyboardInset' "app/session/[id].tsx" app/connection/add.tsx "app/connection/[id].tsx" || true
          grep -q 'keyboardInset' app/connection/add.tsx || { echo "!!! keyboardInset missing from the connection form"; exit 1; }
          echo "keyboardInset wired into the connection forms"
          echo "=== speech ==="
          grep -n 'permissionDenied\|ru-RU' src/lib/speech.ts | head -5 || echo "!!! speech not patched"
          echo "=== speech i18n ==="
          node -e "const j=require('./src/lib/i18n/en.json'); console.log(JSON.stringify(j.chat.speechErrors))"
          echo "=== archive ==="
          ls src/lib/session-archive.ts src/components/ActionSheet.tsx || echo "!!! archive files MISSING"
          node -e "const j=require('./src/lib/i18n/en.json'); console.log(JSON.stringify(j.sessionsList.archive.actions))"
          grep -c 'sessionsList.archive' "app/(tabs)/index.tsx" || echo "!!! archive UI missing"
          echo "=== links point at this fork ==="
          grep -n "Gegaremant/OpenCode_Mobile_RU" src/lib/links.ts "app/(tabs)/settings.tsx" | head -3
          echo "=== drafts ==="
          ls src/lib/session-draft.ts || echo "!!! session-draft.ts MISSING"
          grep -c 'useSessionDraft' "app/session/[id].tsx" || echo "!!! composer not autosaving"
          echo "=== voice tuning ==="
          grep -n 'com.google.android.as\|requiresOnDeviceRecognition\|contextualStrings' src/lib/speech.ts | head -4
          echo "=== theme ==="
          ls src/lib/theme.ts || echo "!!! theme shim MISSING"
          grep -rc 'useAppColorScheme' "app/(tabs)/settings.tsx" src/components/AuthGate.tsx | head -2
          node -e "const j=require('./src/lib/i18n/ru.json'); console.log('ru theme:', JSON.stringify(j.settings.theme))"
          echo "=== palette ==="
          grep -c '#8b5cf6' "app/(tabs)/index.tsx" || echo "violet accent is gone"
          grep -c '#999999' src/components/chat/MessageBubble.tsx || echo "old greys are gone"

      - name: Install dependencies
        if: steps.check_sync.outputs.already_synced == 'false'
        working-directory: original-src
        run: npm install --legacy-peer-deps

      # Metro strips types without checking them, so a broken patch would sail
      # all the way to a signed APK. Catch it here instead.
      - name: Typecheck patched sources
        if: steps.check_sync.outputs.already_synced == 'false'
        working-directory: original-src
        run: npm run typecheck

      - name: Expo prebuild
        if: steps.check_sync.outputs.already_synced == 'false'
        working-directory: original-src
        run: npx expo prebuild --platform android --no-install

      - name: Guarantee RECORD_AUDIO for voice input
        if: steps.check_sync.outputs.already_synced == 'false'
        working-directory: original-src
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # expo-image-picker with `"microphonePermission": false` writes a
          # `tools:node="remove"` entry for RECORD_AUDIO that the merger honours
          # unconditionally, so a plain grep for the permission string passes
          # while the permission is actually stripped from the APK. patch-speech.js
          # removes the blocker; this asserts it is really gone.
          if grep -q 'RECORD_AUDIO[^>]*tools:node="remove"\|RECORD_AUDIO.*node="remove"' "$MANIFEST"; then
            echo "ERROR: RECORD_AUDIO is still blocked in the app manifest"
            grep -n "RECORD_AUDIO" "$MANIFEST"
            exit 1
          fi
          if ! grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"; then
            echo "RECORD_AUDIO missing from the app manifest — inserting"
            sed -i 's|<application |<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n  <application |' "$MANIFEST"
          fi
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST" || { echo "ERROR: RECORD_AUDIO still missing"; exit 1; }
          echo "RECORD_AUDIO declared and not blocked"

      - name: Strip Sentry native upload
        if: steps.check_sync.outputs.already_synced == 'false'
        working-directory: original-src
        run: |
          # No Sentry credentials in this fork, so the SentryUpload gradle task
          # would fail the release build. Remove the gradle hook after prebuild
          # (prebuild regenerates the android/ tree).
          sed -i '/apply from.*sentry.gradle/d' android/app/build.gradle
          grep -q "sentry.gradle" android/app/build.gradle && { echo "ERROR: sentry.gradle still present"; exit 1; } || true
          echo "Sentry gradle hook removed"


      - name: Setup signing
        if: steps.check_sync.outputs.already_synced == 'false'
        working-directory: original-src
        run: |
          if [[ -n "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        if: steps.check_sync.outputs.already_synced == 'false'
        working-directory: original-src/android
        run: |
          # --- pre-build diagnostics: what does Metro actually see? ---
          echo "### config.ts ru line:"; grep -n 'ru:' ../src/lib/i18n/config.ts || echo "!!! config.ts has NO ru"
          echo "### ru.json present:"; ls -la ../src/lib/i18n/ru.json 2>&1
          echo "### ru.json first keys:"; head -c 200 ../src/lib/i18n/ru.json 2>&1
          echo "### locale-resolve:"; grep -n 'ru' ../src/lib/i18n/locale-resolve.ts
          echo "### settings.tsx:"; grep -n 'chooseLocale("ru")\|localeLabels.ru\|languagePickerVisible' "../app/(tabs)/settings.tsx" || echo "!!! no ru menu"

          # Force Metro to rebuild the JS bundle from the patched sources.
          rm -rf .gradle
          rm -rf ~/.gradle/caches/build-cache-1
          rm -rf ../node_modules/.cache
          rm -rf /tmp/metro-* /tmp/haste-map-* 2>/dev/null || true
          ./gradlew --no-build-cache clean assembleRelease

      # The permission only has to exist in the *merged* manifest to matter, and
      # the merged manifest is the artifact that actually ships.
      - name: Verify the built APK
        if: steps.check_sync.outputs.already_synced == 'false'
        working-directory: original-src/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | tail -1)/aapt2"
          [ -f "$APK" ] || { echo "ERROR: no APK at $APK"; exit 1; }
          echo "APK: $(du -h "$APK" | cut -f1)"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep "uses-permission" | wc -l | xargs echo "permissions in APK:"
          echo "$BADGING" | grep -q "android.permission.RECORD_AUDIO" \
            || { echo "ERROR: RECORD_AUDIO is NOT in the APK — voice input cannot work"; exit 1; }
          echo "RECORD_AUDIO confirmed in the APK"
          MERGED=$(find app/build/intermediates -name AndroidManifest.xml -path "*merged_manifests/release*" | head -1)
          if [ -n "$MERGED" ]; then
            echo "merged manifest: $MERGED"
            grep -c "RECORD_AUDIO" "$MERGED" | xargs echo "RECORD_AUDIO entries:"
          fi

          # The app ships a Hermes bundle, so Metro's non-ASCII escapes and the
          # UTF-16LE string table mean plain grep finds nothing. Search for the
          # ASCII-only v2 route markers instead: they can only be in the bundle
          # if the v2 client was actually compiled in, and their absence is the
          # exact symptom of "the app cannot talk to a v2 server" that we are
          # shipping against. See the README section on bundle diagnostics.
          #
          # Read the bundle back out of the APK rather than guessing a path in
          # the gradle tree — where prebuild leaves it varies between Expo
          # versions, and only the packaged APK is what the user installs.
          BUNDLE=$(mktemp -d)/index.android.bundle
          unzip -p "$APK" assets/index.android.bundle > "$BUNDLE" \
            || { echo "ERROR: no assets/index.android.bundle inside the APK"; exit 1; }
          echo "bundle size: $(du -h "$BUNDLE" | cut -f1)"
          echo "=== v2 transport in bundle ==="
          for MARKER in "/api/info" "/api/session" "detectServerApi"; do
            if grep -qa -- "$MARKER" "$BUNDLE"; then
              echo "  found: $MARKER"
            else
              echo "  MISSING: $MARKER — the v2 client is not in this build"
            fi
          done
          grep -qa -- "/api/info" "$BUNDLE" || {
            echo "ERROR: v2 client absent from the bundle. This build cannot talk to an opencode v2 server."
            echo "       Check UPSTREAM_REPO / UPSTREAM_REF at the top of this workflow."
            exit 1
          }
          echo "v2 client confirmed in the JS bundle"

      - name: Get version from app.json
        if: steps.check_sync.outputs.already_synced == 'false'
        id: version
        working-directory: original-src
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk OpenCode_mobile_ru.apk

      - name: Upload APK artifact
        if: steps.check_sync.outputs.already_synced == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: opencode-mobile-ru-${{ steps.version.outputs.version }}
          path: original-src/OpenCode_mobile_ru.apk

      - name: Create release in self repo
        if: steps.check_sync.outputs.already_synced == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "OpenCode Mobile RU v${{ steps.version.outputs.version }}"
          body: |
            Автоматически собрано из `${{ env.UPSTREAM_REPO }}@${{ env.UPSTREAM_REF }}` — коммит [${{ steps.source.outputs.sha }}](https://github.com/${{ env.UPSTREAM_REPO }}/commit/${{ steps.source.outputs.sha }}).

            С русской локализацией.
          files: original-src/OpenCode_mobile_ru.apk
          generate_release_notes: true

      - name: Mark as synced
        if: steps.check_sync.outputs.already_synced == 'false'
        run: |
          # Keyed on the commit plus the overlay hash, matching check_sync.
          git tag "synced-${{ steps.source.outputs.sha }}-${{ steps.source.outputs.overlay }}"
          git push origin "synced-${{ steps.source.outputs.sha }}-${{ steps.source.outputs.overlay }}"
